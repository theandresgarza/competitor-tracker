name: Collect studio schedules

on:
  schedule:
    # backup only: GitHub often skips scheduled runs. cron-job.org starts the
    # every-30-minutes runs through workflow_dispatch (keeps us under 2,000 free minutes)
    - cron: "7 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read schedules
        run: python collect.py
      - name: Rebuild the view
        run: python report.py
      - name: Save the data
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data view
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Schedules $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
