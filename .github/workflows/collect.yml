name: Collect studio schedules

on:
  schedule:
    # every 15 minutes, a few minutes before sessions that start on the quarter hour.
    # GitHub often skips scheduled runs, so cron-job.org also starts runs at these
    # minutes through workflow_dispatch. Public repo, so minutes are free.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # the newest commit, not the one that started the run: a late scheduled run
          # can start after another run has already saved newer data
          ref: main
      - name: Read schedules
        run: python3 collect.py
      - name: Rebuild the view
        run: python3 report.py
      - name: Save the data
        # save readings even if the view failed to build
        if: ${{ !cancelled() }}
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data view
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Schedules $(date -u +%Y-%m-%dT%H:%MZ)"
            # if another run saved data in the meantime, start from its data and read again
            for try in 1 2 3; do
              if git pull --rebase && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              git fetch origin main && git reset --hard origin/main
              python3 collect.py && python3 report.py || true
              git add data view
              git diff --cached --quiet && exit 0
              git commit -m "Schedules $(date -u +%Y-%m-%dT%H:%MZ)"
            done
            exit 1
          fi
